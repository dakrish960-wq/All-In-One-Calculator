name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Initialize Capacitor (if needed)
        run: |
          if [ ! -d "android" ]; then
            npx cap init --web-dir=dist com.calculator.allinone "All In One Calculator"
          fi

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync with Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          draft: false
          prerelease: false
          tag_name: v${{ steps.date.outputs.date }}
          name: All In One Calculator - ${{ steps.date.outputs.date }}
          body: |
            📱 **All In One Calculator - Release APK**
            
            **Release Date:** ${{ steps.date.outputs.date }}
            **Commit:** ${{ github.sha }}
            
            ### Features:
            - Standard Calculator
            - Age Calculator
            - Gold Calculator
            - Viral Number Calculator
            - Weight/BMI Calculator
            - Multi-Currency Converter
            - Love Compatibility Calculator
            - Start.io Live Ads Integration
            
            ### Installation:
            1. Download the APK file
            2. Enable "Unknown Sources" in Settings
            3. Install the APK
            4. Enjoy!
            
            ---
            Ready for APKPure upload ✅
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: All-In-One-Calculator-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 30
