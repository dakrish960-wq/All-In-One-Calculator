name: Android CI - Build APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "20"
      JAVA_VERSION: "17"
      STARTIO_APP_ID: "207279640"

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK 34
      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # 6. Install npm dependencies
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^5.0.0 @capacitor/cli@^5.0.0 @capacitor/android@^5.0.0 --legacy-peer-deps

      # 7. Build React/Vite application
      - name: Build web application
        run: |
          npm run build

      # 8. Create Capacitor Android project
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      # 9. Configure Android SDK 34
      - name: Configure Android SDK 34
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/variables.gradle")

          if not file.exists():
              raise SystemExit("android/variables.gradle was not found.")

          text = file.read_text()

          text = re.sub(
              r'compileSdkVersion\s*=\s*\d+',
              'compileSdkVersion = 34',
              text
          )

          text = re.sub(
              r'targetSdkVersion\s*=\s*\d+',
              'targetSdkVersion = 34',
              text
          )

          text = re.sub(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 22',
              text
          )

          file.write_text(text)

          print("Android SDK configured to 34")
          PY

      # 10. Force Android 34 in app build.gradle if necessary
      - name: Configure app compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/app/build.gradle")

          if not file.exists():
              raise SystemExit("android/app/build.gradle was not found.")

          text = file.read_text()

          text = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 34',
              text
          )

          text = re.sub(
              r'targetSdk\s+\d+',
              'targetSdk 34',
              text
          )

          file.write_text(text)

          print("app/build.gradle configured.")
          PY

      # 11. Add Start.io SDK
      - name: Add Start.io SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")

          text = file.read_text()

          # Remove previous Start.io dependency if present
          lines = text.splitlines()

          lines = [
              line for line in lines
              if "com.startapp:inapp-sdk:" not in line
          ]

          text = "\n".join(lines) + "\n"

          dependency = "    implementation 'com.startapp:inapp-sdk:5.0.2'"

          if "dependencies {" not in text:
              raise SystemExit("Gradle dependencies block was not found.")

          text = text.replace(
              "dependencies {",
              "dependencies {\n" + dependency,
              1
          )

          file.write_text(text)

          print("Start.io SDK added.")
          PY

      # 12. Create Start.io native plugin
      - name: Create Start.io native plugin
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/calculator/app"

          mkdir -p "$PACKAGE_DIR"

          cat > "$PACKAGE_DIR/StartIoPlugin.java" <<'JAVA'
          package com.calculator.app;

          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;

          @CapacitorPlugin(name = "StartIo")
          public class StartIoPlugin extends Plugin {

              private static final String APP_ID = "207279640";

              private StartAppAd interstitialAd;
              private boolean adReady = false;

              @Override
              public void load() {
                  super.load();

                  StartAppSDK.initParams(getContext(), APP_ID)
                          .setReturnAdsEnabled(false)
                          .setCallback(new Runnable() {
                              @Override
                              public void run() {
                                  loadInterstitialInternal();
                              }
                          })
                          .init();

                  // TEST MODE ONLY
                  StartAppSDK.setTestAdsEnabled(true);
              }

              private void loadInterstitialInternal() {

                  if (getActivity() == null) {
                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      interstitialAd = new StartAppAd(getActivity());
                      adReady = false;

                      interstitialAd.loadAd(new AdEventListener() {

                          @Override
                          public void onReceiveAd(@NonNull Ad ad) {
                              adReady = true;
                          }

                          @Override
                          public void onFailedToReceiveAd(@Nullable Ad ad) {
                              adReady = false;
                          }
                      });
                  });
              }

              @PluginMethod
              public void loadInterstitial(PluginCall call) {

                  loadInterstitialInternal();

                  JSObject result = new JSObject();
                  result.put("started", true);

                  call.resolve(result);
              }

              @PluginMethod
              public void showInterstitial(PluginCall call) {

                  if (getActivity() == null) {
                      call.reject("Activity is not available.");
                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      if (interstitialAd == null || !adReady) {

                          JSObject result = new JSObject();
                          result.put("shown", false);
                          result.put("reason", "Ad is not ready");

                          call.resolve(result);
                          return;
                      }

                      interstitialAd.showAd();

                      adReady = false;

                      JSObject result = new JSObject();
                      result.put("shown", true);

                      call.resolve(result);

                      // Preload next ad
                      loadInterstitialInternal();
                  });
              }
          }
          JAVA

          echo "Start.io native plugin created."

      # 13. Register Start.io plugin
      - name: Register Start.io plugin
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java was not found."
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          text = file.read_text()

          import_line = "import com.calculator.app.StartIoPlugin;"

          if import_line not in text:
              bridge_import = "import com.getcapacitor.BridgeActivity;"

              if bridge_import in text:
                  text = text.replace(
                      bridge_import,
                      bridge_import + "\n" + import_line
                  )
              else:
                  text = import_line + "\n" + text

          if "registerPlugin(StartIoPlugin.class);" not in text:

              marker = "public class MainActivity extends BridgeActivity {"

              if marker not in text:
                  raise SystemExit(
                      "MainActivity class declaration was not found."
                  )

              replacement = (
                  marker
                  + "\n\n"
                  + "    @Override\n"
                  + "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  + "        super.onCreate(savedInstanceState);\n"
                  + "        registerPlugin(StartIoPlugin.class);\n"
                  + "    }\n"
              )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          file.write_text(text)

          print("Start.io plugin registered.")
          PY

      # 14. Create JavaScript bridge
      - name: Create Start.io JavaScript bridge
        run: |
          mkdir -p src/lib

          cat > src/lib/startIo.ts <<'EOF'
          import { registerPlugin } from '@capacitor/core';

          export interface StartIoPlugin {
            loadInterstitial(): Promise<{
              started: boolean;
            }>;

            showInterstitial(): Promise<{
              shown: boolean;
              reason?: string;
            }>;
          }

          export const StartIo =
            registerPlugin<StartIoPlugin>('StartIo');
          EOF

          echo "JavaScript bridge created."

      # 15. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 16. Clean Android build
      - name: Clean Android build
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      # 17. Build Debug APK
      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 18. Build Release AAB
      - name: Build Android Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      # 19. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-startio
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 20. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
