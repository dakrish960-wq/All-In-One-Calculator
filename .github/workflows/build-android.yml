name: Android CI - Build APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK & AAB with Start.io Banner
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'
      JAVA_VERSION: '17'
      STARTIO_APP_ID: '207279640'

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK 35
      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 6. Install npm dependencies
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^5.0.0 @capacitor/cli@^5.0.0 @capacitor/android@^5.0.0 --legacy-peer-deps

      # 7. Build web app
      - name: Build web application
        run: npm run build

      # 8. Add Android
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      # 9. Configure SDK 35
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/variables.gradle")

          if not file.exists():
              raise SystemExit("android/variables.gradle not found")

          text = file.read_text()

          replacements = {
              "compileSdkVersion = 33": "compileSdkVersion = 35",
              "targetSdkVersion = 33": "targetSdkVersion = 35",
              "compileSdkVersion = 34": "compileSdkVersion = 35",
              "targetSdkVersion = 34": "targetSdkVersion = 35"
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          file.write_text(text)
          PY

      # 10. Add Start.io SDK
      - name: Add Start.io SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")
          text = file.read_text()

          # Remove old Start.io dependencies
          lines = text.splitlines()
          lines = [
              line for line in lines
              if "com.startapp:inapp-sdk:" not in line
          ]

          text = "\n".join(lines) + "\n"

          dependency = "    implementation 'com.startapp:inapp-sdk:5.0.2'"

          if "dependencies {" not in text:
              raise SystemExit("Gradle dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {\n" + dependency,
              1
          )

          file.write_text(text)
          PY

      # 11. Create Start.io native plugin
      - name: Create Start.io native plugin
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          PACKAGE=$(grep '^package ' "$MAIN_ACTIVITY" | sed 's/package //' | sed 's/;//')

          if [ -z "$PACKAGE" ]; then
            echo "Could not detect package name"
            exit 1
          fi

          PACKAGE_DIR="android/app/src/main/java/$(echo "$PACKAGE" | tr '.' '/')"

          mkdir -p "$PACKAGE_DIR"

          cat > "$PACKAGE_DIR/StartIoPlugin.java" <<JAVA
          package $PACKAGE;

          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;

          @CapacitorPlugin(name = "StartIo")
          public class StartIoPlugin extends Plugin {

              private StartAppAd interstitialAd;
              private boolean adReady = false;

              @Override
              public void load() {
                  super.load();

                  // Start.io is initialized by MainActivity.
                  loadInterstitialInternal();
              }

              private void loadInterstitialInternal() {

                  if (getActivity() == null) {
                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      interstitialAd = new StartAppAd(getActivity());
                      adReady = false;

                      interstitialAd.loadAd(new AdEventListener() {

                          @Override
                          public void onReceiveAd(@NonNull Ad ad) {
                              adReady = true;
                          }

                          @Override
                          public void onFailedToReceiveAd(@Nullable Ad ad) {
                              adReady = false;
                          }
                      });
                  });
              }

              @PluginMethod
              public void loadInterstitial(PluginCall call) {

                  loadInterstitialInternal();

                  JSObject result = new JSObject();
                  result.put("started", true);
                  call.resolve(result);
              }

              @PluginMethod
              public void showInterstitial(PluginCall call) {

                  if (getActivity() == null) {
                      call.reject("Activity is not available");
                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      if (interstitialAd == null || !adReady) {

                          JSObject result = new JSObject();
                          result.put("shown", false);
                          result.put("reason", "Ad is not ready");
                          call.resolve(result);
                          return;
                      }

                      interstitialAd.showAd();

                      adReady = false;

                      JSObject result = new JSObject();
                      result.put("shown", true);
                      call.resolve(result);

                      loadInterstitialInternal();
                  });
              }
          }
          JAVA

          echo "Created StartIoPlugin.java in package: $PACKAGE"

      # 12. Create real native Banner in MainActivity
      - name: Add Start.io Banner to MainActivity
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" "$STARTIO_APP_ID" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          app_id = sys.argv[2]

          text = file.read_text()

          # Add imports
          imports = """
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.adsbase.StartAppSDK;
          """

          if "import com.startapp.sdk.ads.banner.Banner;" not in text:
              marker = "import com.getcapacitor.BridgeActivity;"
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + imports,
                      1
                  )
              else:
                  raise SystemExit(
                      "Capacitor BridgeActivity import not found"
                  )

          # Add StartIoPlugin import
          package_line = [
              line for line in text.splitlines()
              if line.startswith("package ")
          ]

          if not package_line:
              raise SystemExit("Package declaration not found")

          package_name = package_line[0].replace(
              "package ", ""
          ).replace(";", "").strip()

          plugin_import = (
              f"import {package_name}.StartIoPlugin;"
          )

          if plugin_import not in text:
              text = text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  + plugin_import,
                  1
              )

          # Remove old generated onCreate block if present
          start_marker = "    @Override\n    public void onCreate("
          start_index = text.find(start_marker)

          if start_index != -1:
              brace_start = text.find("{", start_index)

              if brace_start != -1:
                  depth = 0
                  end_index = None

                  for i in range(brace_start, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1

                          if depth == 0:
                              end_index = i + 1
                              break

                  if end_index:
                      text = (
                          text[:start_index]
                          + text[end_index:]
                      )

          marker = "public class MainActivity extends BridgeActivity {"

          if marker not in text:
              raise SystemExit(
                  "MainActivity class declaration not found"
              )

          on_create = f"""
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  // Initialize Start.io
                  StartAppSDK.init(this, "{app_id}");

                  // Enable Start.io Test Ads
                  StartAppSDK.setTestAdsEnabled(true);

                  // Register Capacitor Start.io plugin
                  registerPlugin(StartIoPlugin.class);

                  // Get Capacitor's main content container
                  ViewGroup content =
                      findViewById(android.R.id.content);

                  // Create native Start.io Banner
                  Banner startIoBanner = new Banner(this);

                  startIoBanner.setBackgroundColor(Color.WHITE);
                  startIoBanner.setElevation(20f);

                  // Put Banner above the bottom navigation.
                  FrameLayout.LayoutParams bannerParams =
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      );

                  bannerParams.gravity =
                      Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;

                  // Reserve approximately 70dp for the web bottom menu.
                  float density =
                      getResources().getDisplayMetrics().density;

                  bannerParams.bottomMargin =
                      (int) (70 * density);

                  content.addView(startIoBanner, bannerParams);
              }}
          """

          replacement = (
              marker
              + "\n"
              + on_create
          )

          text = text.replace(
              marker,
              replacement,
              1
          )

          file.write_text(text)
          PY

      # 13. Create JavaScript bridge
      - name: Create Start.io JavaScript bridge
        run: |
          mkdir -p src/lib

          cat > src/lib/startIo.ts <<'EOF'
          import { registerPlugin } from '@capacitor/core';

          export interface StartIoPlugin {
            loadInterstitial(): Promise<{
              started: boolean;
            }>;

            showInterstitial(): Promise<{
              shown: boolean;
              reason?: string;
            }>;
          }

          export const StartIo =
            registerPlugin<StartIoPlugin>('StartIo');
          EOF

      # 14. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 15. Build Debug APK
      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 16. Build Release AAB
      - name: Build Android AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      # 17. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-startio-banner
          path: android/app/build/outputs/apk/debug/*.apk

      # 18. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-startio-banner
          path: android/app/build/outputs/bundle/release/*.aab
