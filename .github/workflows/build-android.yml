name: Android CI - Build APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'
      JAVA_VERSION: '17'
      STARTIO_APP_ID: '207279640'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^5.0.0 @capacitor/cli@^5.0.0 @capacitor/android@^5.0.0 --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/variables.gradle")

          if not file.exists():
              raise SystemExit("android/variables.gradle not found")

          text = file.read_text()

          text = re.sub(
              r'compileSdkVersion\s*=\s*\d+',
              'compileSdkVersion = 34',
              text
          )

          text = re.sub(
              r'targetSdkVersion\s*=\s*\d+',
              'targetSdkVersion = 34',
              text
          )

          text = re.sub(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 22',
              text
          )

          file.write_text(text)

          print("Android SDK configured to 34")
          PY

      # ---------------------------------------------------------
      # Start.io SDK
      # ---------------------------------------------------------

      - name: Add Start.io SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")

          if not file.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = file.read_text()

          lines = text.splitlines()

          lines = [
              line for line in lines
              if "com.startapp:inapp-sdk:" not in line
          ]

          text = "\n".join(lines) + "\n"

          dependency = "    implementation 'com.startapp:inapp-sdk:5.0.2'"

          if "dependencies {" not in text:
              raise SystemExit("dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {\n" + dependency,
              1
          )

          file.write_text(text)

          print("Start.io SDK added")
          PY

      # ---------------------------------------------------------
      # Create Native Start.io Plugin
      # ---------------------------------------------------------

      - name: Create Start.io Native Plugin
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/calculator/app"

          mkdir -p "$PACKAGE_DIR"

          cat > "$PACKAGE_DIR/StartIoPlugin.java" <<'JAVA'
          package com.calculator.app;

          import android.app.Activity;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.ads.banner.BannerListener;

          @CapacitorPlugin(name = "StartIo")
          public class StartIoPlugin extends Plugin {

              private static final String APP_ID = "207279640";

              private StartAppAd interstitialAd;
              private boolean interstitialReady = false;

              private Banner banner;
              private boolean bannerCreated = false;

              @Override
              public void load() {
                  super.load();

                  Activity activity = getActivity();

                  if (activity == null) {
                      return;
                  }

                  // Test ads MUST be enabled before testing.
                  StartAppSDK.setTestAdsEnabled(true);

                  StartAppSDK.initParams(activity, APP_ID)
                          .setReturnAdsEnabled(false)
                          .setCallback(new Runnable() {
                              @Override
                              public void run() {

                                  // Load interstitial
                                  loadInterstitialInternal();

                                  // Show native banner
                                  activity.runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() {
                                          createNativeBanner();
                                      }
                                  });
                              }
                          })
                          .init();
              }

              /**
               * Create the Start.io Banner automatically.
               *
               * No App.tsx Banner code is required.
               */
              private void createNativeBanner() {

                  Activity activity = getActivity();

                  if (activity == null) {
                      return;
                  }

                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {

                          try {

                              if (bannerCreated) {
                                  return;
                              }

                              View webView = getBridge().getWebView();

                              if (webView == null) {
                                  return;
                              }

                              View parent = (View) webView.getParent();

                              if (!(parent instanceof ViewGroup)) {
                                  return;
                              }

                              ViewGroup parentView =
                                      (ViewGroup) parent;

                              /*
                               * Create Start.io Banner.
                               */
                              banner = new Banner(
                                      activity,
                                      new BannerListener() {

                                          @Override
                                          public void onReceiveAd(
                                                  @NonNull View view
                                          ) {
                                              // Banner loaded successfully.
                                          }

                                          @Override
                                          public void onFailedToReceiveAd(
                                                  @Nullable View view
                                          ) {
                                              /*
                                               * Do NOT call loadAd() here.
                                               * Start.io automatically retries.
                                               */
                                          }

                                          @Override
                                          public void onImpression(
                                                  @NonNull View view
                                          ) {
                                              // Impression received.
                                          }

                                          @Override
                                          public void onClick(
                                                  @NonNull View view
                                          ) {
                                              // Banner clicked.
                                          }
                                      }
                              );

                              /*
                               * Banner container.
                               */
                              FrameLayout bannerContainer =
                                      new FrameLayout(activity);

                              bannerContainer.setGravity(
                                      Gravity.CENTER
                              );

                              /*
                               * Position:
                               *
                               * Bottom of screen
                               * minus approximately 60dp
                               *
                               * This keeps the Banner above
                               * the React bottom navigation.
                               */
                              FrameLayout.LayoutParams containerParams =
                                      new FrameLayout.LayoutParams(
                                              ViewGroup.LayoutParams.MATCH_PARENT,
                                              ViewGroup.LayoutParams.WRAP_CONTENT
                                      );

                              containerParams.gravity =
                                      Gravity.BOTTOM |
                                      Gravity.CENTER_HORIZONTAL;

                              containerParams.bottomMargin =
                                      dpToPx(activity, 58);

                              /*
                               * Keep Banner above WebView.
                               */
                              bannerContainer.setElevation(1000f);

                              parentView.addView(
                                      bannerContainer,
                                      containerParams
                              );

                              /*
                               * Add actual Start.io Banner.
                               */
                              FrameLayout.LayoutParams bannerParams =
                                      new FrameLayout.LayoutParams(
                                              ViewGroup.LayoutParams.WRAP_CONTENT,
                                              ViewGroup.LayoutParams.WRAP_CONTENT
                                      );

                              bannerParams.gravity =
                                      Gravity.CENTER;

                              bannerContainer.addView(
                                      banner,
                                      bannerParams
                              );

                              bannerCreated = true;

                          } catch (Exception e) {

                              /*
                               * Never crash the calculator
                               * because of an ad problem.
                               */
                              banner = null;
                              bannerCreated = false;
                          }
                      }
                  });
              }

              /**
               * Convert DP to pixels.
               */
              private int dpToPx(
                      Activity activity,
                      int dp
              ) {

                  float density =
                          activity.getResources()
                                  .getDisplayMetrics()
                                  .density;

                  return Math.round(dp * density);
              }

              /**
               * Load Interstitial.
               */
              private void loadInterstitialInternal() {

                  Activity activity = getActivity();

                  if (activity == null) {
                      return;
                  }

                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {

                          interstitialAd =
                                  new StartAppAd(activity);

                          interstitialReady = false;

                          interstitialAd.loadAd(
                                  new AdEventListener() {

                                      @Override
                                      public void onReceiveAd(
                                              @NonNull Ad ad
                                      ) {
                                          interstitialReady = true;
                                      }

                                      @Override
                                      public void onFailedToReceiveAd(
                                              @Nullable Ad ad
                                      ) {
                                          interstitialReady = false;
                                      }
                                  }
                          );
                      }
                  });
              }

              /**
               * JavaScript bridge:
               * Load Interstitial.
               */
              @PluginMethod
              public void loadInterstitial(
                      PluginCall call
              ) {

                  loadInterstitialInternal();

                  JSObject result =
                          new JSObject();

                  result.put(
                          "started",
                          true
                  );

                  call.resolve(result);
              }

              /**
               * JavaScript bridge:
               * Show Interstitial.
               */
              @PluginMethod
              public void showInterstitial(
                      PluginCall call
              ) {

                  Activity activity = getActivity();

                  if (activity == null) {

                      JSObject result =
                              new JSObject();

                      result.put(
                              "shown",
                              false
                      );

                      result.put(
                              "reason",
                              "Activity unavailable"
                      );

                      call.resolve(result);

                      return;
                  }

                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {

                          if (
                                  interstitialAd == null ||
                                  !interstitialReady
                          ) {

                              JSObject result =
                                      new JSObject();

                              result.put(
                                      "shown",
                                      false
                              );

                              result.put(
                                      "reason",
                                      "Ad is not ready"
                              );

                              call.resolve(result);

                              return;
                          }

                          interstitialAd.showAd();

                          interstitialReady = false;

                          JSObject result =
                                  new JSObject();

                          result.put(
                                  "shown",
                                  true
                          );

                          call.resolve(result);

                          loadInterstitialInternal();
                      }
                  });
              }
          }
          JAVA

          echo "StartIoPlugin.java created successfully"

      # ---------------------------------------------------------
      # Register Native Plugin
      # ---------------------------------------------------------

      - name: Register Start.io Plugin
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          text = file.read_text()

          if "import com.calculator.app.StartIoPlugin;" not in text:

              text = text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import com.calculator.app.StartIoPlugin;"
              )

          if "registerPlugin(StartIoPlugin.class);" not in text:

              marker = "public class MainActivity extends BridgeActivity {"

              replacement = (
                  marker
                  + "\n\n"
                  + "    @Override\n"
                  + "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  + "        super.onCreate(savedInstanceState);\n"
                  + "        registerPlugin(StartIoPlugin.class);\n"
                  + "    }\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "MainActivity declaration not found"
                  )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          file.write_text(text)

          print("Start.io plugin registered")
          PY

      # ---------------------------------------------------------
      # JavaScript Bridge
      # ---------------------------------------------------------

      - name: Create Start.io JavaScript Bridge
        run: |
          mkdir -p src/lib

          cat > src/lib/startIo.ts <<'EOF'
          import { registerPlugin } from '@capacitor/core';

          export interface StartIoPlugin {

            loadInterstitial(): Promise<{
              started: boolean;
            }>;

            showInterstitial(): Promise<{
              shown: boolean;
              reason?: string;
            }>;

          }

          export const StartIo =
            registerPlugin<StartIoPlugin>('StartIo');
          EOF

      # ---------------------------------------------------------
      # Sync Capacitor
      # ---------------------------------------------------------

      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ---------------------------------------------------------
      # Clean Android
      # ---------------------------------------------------------

      - name: Clean Android
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------------------------------------------------------
      # Build AAB
      # ---------------------------------------------------------

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-startio-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ---------------------------------------------------------
      # Upload AAB
      # ---------------------------------------------------------

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: calculator-startio-aab
          path: android/app/build/outputs/bundle/release/*.aab
