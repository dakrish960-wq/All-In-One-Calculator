name: Android CI - Build APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'
      JAVA_VERSION: '17'
      STARTIO_APP_ID: '207279640'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^5.0.0 @capacitor/cli@^5.0.0 @capacitor/android@^5.0.0 --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/variables.gradle")

          if not file.exists():
              raise SystemExit("android/variables.gradle not found")

          text = file.read_text()

          text = re.sub(
              r'compileSdkVersion\s*=\s*\d+',
              'compileSdkVersion = 34',
              text
          )

          text = re.sub(
              r'targetSdkVersion\s*=\s*\d+',
              'targetSdkVersion = 34',
              text
          )

          text = re.sub(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 22',
              text
          )

          file.write_text(text)

          print("Android SDK configured to 34")
          PY

      - name: Add Start.io SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")

          if not file.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = file.read_text()

          lines = text.splitlines()

          lines = [
              line for line in lines
              if "com.startapp:inapp-sdk:" not in line
          ]

          text = "\n".join(lines) + "\n"

          dependency = "    implementation 'com.startapp:inapp-sdk:5.0.2'"

          if "dependencies {" not in text:
              raise SystemExit("dependencies block not found")

          text = text.replace(
              "dependencies {",
              "dependencies {\n" + dependency,
              1
          )

          file.write_text(text)

          print("Start.io SDK added")
          PY

      - name: Create Start.io Native Plugin
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/calculator/app"

          mkdir -p "$PACKAGE_DIR"

          cat > "$PACKAGE_DIR/StartIoPlugin.java" <<'JAVA'
          package com.calculator.app;

          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
          import com.startapp.sdk.ads.banner.Banner;

          @CapacitorPlugin(name = "StartIo")
          public class StartIoPlugin extends Plugin {

              private static final String APP_ID = "207279640";

              private StartAppAd interstitialAd;
              private boolean adReady = false;

              private Banner banner;
              private boolean bannerAdded = false;

              @Override
              public void load() {
                  super.load();

                  StartAppSDK.initParams(getContext(), APP_ID)
                          .setReturnAdsEnabled(false)
                          .setCallback(new Runnable() {
                              @Override
                              public void run() {

                                  loadInterstitialInternal();

                                  showBannerInternal();
                              }
                          })
                          .init();

                  // TEST ADS
                  StartAppSDK.setTestAdsEnabled(true);
              }

              private void loadInterstitialInternal() {

                  if (getActivity() == null) {
                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      interstitialAd =
                              new StartAppAd(getActivity());

                      adReady = false;

                      interstitialAd.loadAd(
                              new AdEventListener() {

                                  @Override
                                  public void onReceiveAd(
                                          @NonNull Ad ad) {

                                      adReady = true;
                                  }

                                  @Override
                                  public void onFailedToReceiveAd(
                                          @Nullable Ad ad) {

                                      adReady = false;
                                  }
                              }
                      );
                  });
              }

              private void showBannerInternal() {

                  if (getActivity() == null) {
                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      try {

                          if (bannerAdded) {
                              return;
                          }

                          View webView =
                                  getBridge().getWebView();

                          View parent =
                                  (View) webView.getParent();

                          if (!(parent instanceof ViewGroup)) {
                              return;
                          }

                          ViewGroup parentView =
                                  (ViewGroup) parent;

                          banner =
                                  new Banner(getActivity());

                          FrameLayout.LayoutParams params =
                                  new FrameLayout.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT,
                                          ViewGroup.LayoutParams.WRAP_CONTENT
                                  );

                          params.gravity = Gravity.BOTTOM;

                          parentView.addView(
                                  banner,
                                  params
                          );

                          bannerAdded = true;

                      } catch (Exception ignored) {
                      }
                  });
              }

              @PluginMethod
              public void loadInterstitial(
                      PluginCall call) {

                  loadInterstitialInternal();

                  JSObject result = new JSObject();

                  result.put(
                          "started",
                          true
                  );

                  call.resolve(result);
              }

              @PluginMethod
              public void showInterstitial(
                      PluginCall call) {

                  if (getActivity() == null) {

                      JSObject result =
                              new JSObject();

                      result.put(
                              "shown",
                              false
                      );

                      result.put(
                              "reason",
                              "Activity unavailable"
                      );

                      call.resolve(result);

                      return;
                  }

                  getActivity().runOnUiThread(() -> {

                      if (
                              interstitialAd == null ||
                              !adReady
                      ) {

                          JSObject result =
                                  new JSObject();

                          result.put(
                                  "shown",
                                  false
                          );

                          result.put(
                                  "reason",
                                  "Ad is not ready"
                          );

                          call.resolve(result);

                          return;
                      }

                      interstitialAd.showAd();

                      adReady = false;

                      JSObject result =
                              new JSObject();

                      result.put(
                              "shown",
                              true
                      );

                      call.resolve(result);

                      loadInterstitialInternal();
                  });
              }
          }
          JAVA

      - name: Register Start.io Plugin
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          text = file.read_text()

          if "import com.calculator.app.StartIoPlugin;" not in text:
              text = text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import com.calculator.app.StartIoPlugin;"
              )

          if "registerPlugin(StartIoPlugin.class);" not in text:

              marker = "public class MainActivity extends BridgeActivity {"

              replacement = (
                  marker
                  + "\n\n"
                  + "    @Override\n"
                  + "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  + "        super.onCreate(savedInstanceState);\n"
                  + "        registerPlugin(StartIoPlugin.class);\n"
                  + "    }\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "MainActivity declaration not found"
                  )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          file.write_text(text)
          PY

      - name: Create Start.io JavaScript Bridge
        run: |
          mkdir -p src/lib

          cat > src/lib/startIo.ts <<'EOF'
          import { registerPlugin } from '@capacitor/core';

          export interface StartIoPlugin {

            loadInterstitial(): Promise<{
              started: boolean;
            }>;

            showInterstitial(): Promise<{
              shown: boolean;
              reason?: string;
            }>;
          }

          export const StartIo =
            registerPlugin<StartIoPlugin>('StartIo');
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Clean Android
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-startio-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: calculator-startio-aab
          path: android/app/build/outputs/bundle/release/*.aab
